<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5faf7"><title>Моя заявка — Северная звезда</title>
<style>
:root{--ink:#18231f;--muted:#6c7973;--mint:#1dbb89;--line:#e4ece7;--bg:#f5faf7;--card:#fff;--lav:#8275e9;--red:#c44e44}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#dff8ed,transparent 30%),radial-gradient(circle at 90% 0,#eeeaff,transparent 28%),var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);min-height:100vh}button,input,textarea{font:inherit}a{color:inherit}.wrap{width:min(760px,calc(100% - 28px));margin:auto;padding:28px 0 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font-weight:950;text-decoration:none}.back{font-weight:850;color:var(--muted)}.card{background:rgba(255,255,255,.94);border:1px solid #fff;border-radius:28px;padding:25px;box-shadow:0 24px 75px rgba(29,59,47,.11)}.loading{text-align:center;padding:60px;color:var(--muted)}.status{display:inline-flex;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:950;background:#fff1d8;color:#96610d}.status.accepted{background:#e5f8f0;color:#087455}.status.arrived,.status.in_progress{background:#eeebff;color:#6254c7}.status.completed{background:#eef2f0;color:#52615a}.status.rejected,.status.no_show,.status.cancelled{background:#fff0ed;color:#a74439}.title{font-size:34px;letter-spacing:-1.5px;margin:13px 0 6px}.sub{color:var(--muted);margin:0 0 22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{padding:15px;border-radius:16px;background:#f5f8f6}.box small{display:block;color:var(--muted);font-weight:800;margin-bottom:4px}.box b{font-size:16px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.btn{border:0;border-radius:13px;padding:12px 15px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,var(--mint),#0e9771);color:#fff}.secondary{background:#eef4f1}.danger{background:#fff0ed;color:#aa453b}.notice{padding:12px;border-radius:13px;background:#eef7f3;color:#176b52;margin-top:14px;font-weight:800}.panel{display:none;margin-top:18px;padding:18px;border-radius:20px;background:#f8faf9;border:1px solid var(--line)}.panel.show{display:block}.input{width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;background:#fff;outline:0;margin:5px 0}.input:focus{border-color:var(--mint);box-shadow:0 0 0 4px #e6f8f1}.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:9px}.slot{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 3px;font-weight:850;cursor:pointer}.slot.on{background:#e5f9f1;border-color:var(--mint);color:#087455}.empty{grid-column:1/-1;text-align:center;padding:12px;color:var(--muted);background:#f0f4f2;border-radius:10px}.stars{display:flex;gap:4px;margin:8px 0}.star{font-size:27px;border:0;background:transparent;color:#d8d8d8;cursor:pointer;padding:2px}.star.on{color:#e4a600}.sep{height:1px;background:var(--line);margin:20px 0}.error{background:#fff0ed;color:#a74439}.timeline{display:flex;gap:6px;align-items:center;margin:18px 0}.dot{height:7px;flex:1;background:#e7ece9;border-radius:999px}.dot.on{background:var(--mint)}@media(max-width:560px){.grid{grid-template-columns:1fr}.slots{grid-template-columns:repeat(3,1fr)}.card{padding:19px}.title{font-size:29px}.top{align-items:flex-start}}
</style></head><body><div class="wrap"><div class="top"><a class="brand" href="/">🐾 Северная звезда</a><a class="back" href="/">← На сайт</a></div><div id="root" class="card"><div class="loading">Загружаем заявку…</div></div></div>
<script>
const $=s=>document.querySelector(s);const token=new URLSearchParams(location.search).get('t')||'';let booking=null,chosen='',rating=5;
const statusMap={new:'Ожидает подтверждения',accepted:'Подтверждена',arrived:'Вы в клинике',in_progress:'Идёт приём',completed:'Завершена',rejected:'Отклонена',no_show:'Не пришли',cancelled:'Отменена'};
const serviceMap={exam:'Осмотр',ultrasound:'УЗИ',xray:'Рентген',vaccination:'Вакцинация',tests:'Анализы',inpatient:'Стационар',other:'Другое'};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(url,opt){const r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Ошибка сервера');return d}
function step(s){const order=['new','accepted','arrived','in_progress','completed'],i=order.indexOf(s);return i<0?0:i+1}
function canChange(){return booking&&!['completed','rejected','no_show','cancelled'].includes(booking.status)}
function render(){const b=booking,s=step(b.status),inpatient=b.service==='inpatient';$('#root').innerHTML=`<span class="status ${esc(b.status)}">${esc(statusMap[b.status]||b.status)}</span><h1 class="title">Заявка №${esc(b.id)}</h1><p class="sub">${esc(b.owner_name)}, здесь всегда отображается актуальное состояние записи для ${esc(b.pet)}.</p><div class="timeline">${[1,2,3,4,5].map(i=>`<span class="dot ${i<=s?'on':''}"></span>`).join('')}</div><div class="grid"><div class="box"><small>Услуга</small><b>${esc(serviceMap[b.service]||b.service)}</b></div><div class="box"><small>${inpatient?'Период':'Дата и время'}</small><b>${inpatient?`${esc(b.stay_start)} — ${esc(b.stay_end)}`:`${esc(b.booking_date)} · ${esc(b.booking_time)}`}</b></div><div class="box"><small>Питомец</small><b>${esc(b.pet)}${b.pet_age?' · '+esc(b.pet_age):''}</b></div><div class="box"><small>Тип приёма</small><b>${b.booking_type==='traumatologist'?'Травматолог':'Обычный приём'}</b></div></div>${b.status==='new'?'<div class="notice">Заявка отправлена и ожидает подтверждения клиникой.</div>':''}${b.status==='cancelled'?'<div class="notice error">Запись отменена клиентом.</div>':''}<div class="actions">${canChange()&&!inpatient?'<button class="btn primary" id="resBtn">Перенести</button>':''}${canChange()?'<button class="btn danger" id="cancelBtn">Отменить запись</button>':''}<a class="btn secondary" href="tel:+79116480644">Позвонить в клинику</a></div><div id="resPanel" class="panel"><b>Выберите новую дату и время</b><input id="newDate" class="input" type="date"><div id="slots" class="slots"><div class="empty">Сначала выберите дату</div></div><button id="saveRes" class="btn primary" style="margin-top:10px" disabled>Отправить перенос</button></div>${b.status==='completed'?reviewHtml():''}`;if($('#resBtn'))$('#resBtn').onclick=()=>{$('#resPanel').classList.toggle('show');$('#newDate').min=today()};if($('#newDate'))$('#newDate').onchange=loadSlots;if($('#saveRes'))$('#saveRes').onclick=reschedule;if($('#cancelBtn'))$('#cancelBtn').onclick=cancelBooking;bindReview()}
function reviewHtml(){if(booking.review_submitted)return'<div class="sep"></div><div class="notice">Спасибо! Отзыв по этому визиту уже отправлен.</div>';return`<div class="sep"></div><h2>Как прошёл визит?</h2><p class="sub">Отзыв появится на сайте после подтверждения клиникой.</p><div class="stars">${[1,2,3,4,5].map(n=>`<button class="star on" data-n="${n}">★</button>`).join('')}</div><input id="reviewName" class="input" value="${esc(booking.owner_name||'')}" placeholder="Имя"><textarea id="reviewText" class="input" rows="4" placeholder="Напишите несколько слов"></textarea><button id="sendReview" class="btn primary">Отправить отзыв</button><div id="reviewMsg"></div>`}
function bindReview(){document.querySelectorAll('.star').forEach(x=>x.onclick=()=>{rating=+x.dataset.n;document.querySelectorAll('.star').forEach(y=>y.classList.toggle('on',+y.dataset.n<=rating))});if($('#sendReview'))$('#sendReview').onclick=sendReview}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
async function loadSlots(){chosen='';const box=$('#slots');box.innerHTML='<div class="empty">Загружаем…</div>';try{const d=await api('/.netlify/functions/get-available-slots?date='+encodeURIComponent($('#newDate').value),{cache:'no-store'});box.innerHTML=d.slots.length?d.slots.map(t=>`<button class="slot" data-time="${t}">${t}</button>`).join(''):'<div class="empty">Свободного времени нет</div>';document.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{document.querySelectorAll('.slot').forEach(x=>x.classList.remove('on'));b.classList.add('on');chosen=b.dataset.time;$('#saveRes').disabled=false})}catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function reschedule(){if(!chosen)return;const btn=$('#saveRes');btn.disabled=true;try{await api('/.netlify/functions/public-booking',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'reschedule',token,booking_date:$('#newDate').value,booking_time:chosen})});await load()}catch(e){alert(e.message);btn.disabled=false}}
async function cancelBooking(){if(!confirm('Отменить эту запись?'))return;try{await api('/.netlify/functions/public-booking',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'cancel',token})});await load()}catch(e){alert(e.message)}}
async function sendReview(){const btn=$('#sendReview'),msg=$('#reviewMsg');btn.disabled=true;try{const d=await api('/.netlify/functions/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,rating,display_name:$('#reviewName').value.trim(),text:$('#reviewText').value.trim()})});msg.className='notice';msg.textContent=d.message;booking.review_submitted=true;setTimeout(render,900)}catch(e){msg.className='notice error';msg.textContent=e.message;btn.disabled=false}}
async function load(){if(!token){$('#root').innerHTML='<div class="loading">Ссылка на заявку неполная.</div>';return}try{const d=await api('/.netlify/functions/public-booking?token='+encodeURIComponent(token),{cache:'no-store'});booking=d.booking;render()}catch(e){$('#root').innerHTML='<div class="loading">'+esc(e.message)+'</div>'}}load();
</script></body></html>
