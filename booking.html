<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><meta content="#f6faf8" name="theme-color"/><meta content="noindex,nofollow,noarchive" name="robots"/><meta content="no-referrer" name="referrer"/><title>Моя запись — Северная звезда</title><link href="/icons/site-icon-192.png" rel="icon"/><link href="/icons/site-icon-192.png" rel="apple-touch-icon"/><script>try{if(localStorage.getItem('sz-theme')==='dark')document.documentElement.dataset.theme='dark'}catch{}</script>
<style>
:root{--bg:#f6faf8;--card:#fff;--ink:#14231d;--muted:#68776f;--line:#dfe9e4;--mint:#17b986;--mint2:#07815e;--mintsoft:#e7f8f1;--purple:#675cc8;--purplesoft:#eeecff;--danger:#b84e45;--dangersoft:#fff0ed;--warning:#8b620c;--warningsoft:#fff6dd;--shadow:0 22px 70px rgba(21,59,44,.1);color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 0,#d9f7e9,transparent 28%),radial-gradient(circle at 92% 0,#e8e5ff,transparent 26%),var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);line-height:1.48}button,input{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.wrap{width:min(760px,calc(100% - 24px));margin:auto;padding:22px 0 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:9px;font-weight:950}.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(145deg,#d8f7e9,#eeecff);display:grid;place-items:center}.logo svg{width:24px}.topBtns{display:flex;gap:7px}.iconBtn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 11px;border-radius:11px;font-weight:850}.card{background:color-mix(in srgb,var(--card) 95%,transparent);border:1px solid var(--line);border-radius:27px;padding:24px;box-shadow:var(--shadow);backdrop-filter:blur(12px)}.loading{text-align:center;color:var(--muted);padding:52px 12px}.status{display:inline-flex;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:950;background:var(--warningsoft);color:var(--warning)}.status.accepted{background:var(--mintsoft);color:#087153}.status.arrived,.status.in_progress{background:var(--purplesoft);color:var(--purple)}.status.completed{background:#eef2f0;color:#52615a}.status.rejected,.status.no_show,.status.cancelled{background:var(--dangersoft);color:var(--danger)}h1{font-size:clamp(28px,6vw,38px);letter-spacing:-1.5px;margin:12px 0 5px}.sub{color:var(--muted);margin:0 0 17px}.timeline{display:flex;gap:6px;margin:16px 0}.timeline i{height:7px;flex:1;border-radius:999px;background:var(--line)}.timeline i.on{background:var(--mint)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.box{background:color-mix(in srgb,var(--bg) 80%,var(--card));border:1px solid var(--line);border-radius:15px;padding:13px}.box small{display:block;color:var(--muted);font-size:11px;font-weight:850;margin-bottom:3px}.box b{font-size:15px}.notice{margin-top:13px;border-radius:14px;padding:12px 13px;background:var(--mintsoft);color:#087153;font-weight:800;font-size:13px}.notice.error{background:var(--dangersoft);color:var(--danger)}.change{margin:15px 0;padding:16px;border-radius:17px;background:linear-gradient(135deg,#fff5d9,#fffaf0);border:1px solid #ecd99f;color:#65490c}.change h3{margin:0 0 8px;font-size:17px}.changeGrid{display:grid;grid-template-columns:1fr auto 1fr;gap:9px;align-items:center}.changeBox{padding:10px;border-radius:12px;background:rgba(255,255,255,.65)}.changeBox small{display:block;color:#8d722f;font-weight:800}.reason{font-size:12px;margin-top:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:900;display:inline-flex;justify-content:center;align-items:center}.primary{background:linear-gradient(135deg,var(--mint),var(--mint2));color:#fff}.secondary{background:var(--mintsoft);color:var(--ink);border:1px solid var(--line)}.danger{background:var(--dangersoft);color:var(--danger)}.panel{display:none;margin-top:15px;padding:15px;border-radius:17px;background:color-mix(in srgb,var(--bg) 82%,var(--card));border:1px solid var(--line)}.panel.show{display:block}.input{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);outline:0}.input:focus{border-color:var(--mint);box-shadow:0 0 0 4px color-mix(in srgb,var(--mint) 14%,transparent)}.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}.slot{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 3px;border-radius:9px;font-weight:850}.slot.on{background:var(--mintsoft);border-color:var(--mint);color:#087153}.empty{grid-column:1/-1;padding:12px;text-align:center;border-radius:11px;background:var(--mintsoft);color:var(--muted);font-size:13px}.inlineError{display:none;margin-top:9px;padding:10px;border-radius:11px;background:var(--dangersoft);color:var(--danger);font-size:13px;font-weight:800}.inlineError.show{display:block}.confirmBox{display:none;margin-top:14px;padding:14px;border-radius:15px;background:var(--dangersoft);color:var(--danger)}.confirmBox.show{display:block}.confirmBox p{margin:0 0 10px;font-size:13px}.savedList{display:grid;gap:8px}.savedItem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:13px;border-radius:14px;background:var(--mintsoft);border:1px solid var(--line)}.savedItem small{color:var(--muted)}.sync{font-size:11px;color:var(--muted);margin-top:11px}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,15px);opacity:0;background:var(--ink);color:white;padding:10px 13px;border-radius:11px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}html[data-theme="dark"]{--bg:#101815;--card:#17221e;--ink:#edf7f2;--muted:#a5b4ac;--line:#2a3a33;--mintsoft:#17372c;--purplesoft:#292447;--dangersoft:#402522;--warningsoft:#3b311d;--shadow:0 22px 70px rgba(0,0,0,.28);color-scheme:dark}html[data-theme="dark"] .change{background:linear-gradient(135deg,#3b311d,#29261b);border-color:#65562d;color:#f1d38b}html[data-theme="dark"] .changeBox{background:rgba(0,0,0,.12)}html[data-theme="dark"] .changeBox small{color:#d3b96f}@media(max-width:560px){.grid{grid-template-columns:1fr}.slots{grid-template-columns:repeat(3,1fr)}.card{padding:17px;border-radius:21px}.top .homeLabel{display:none}.actions .btn{flex:1 1 42%}.changeGrid{grid-template-columns:1fr}.changeGrid>span{text-align:center;transform:rotate(90deg)}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

html,body{max-width:100%;overflow-x:hidden}.wrap,.card,.grid,.box,.actions,.panel,.savedItem{min-width:0}.card,.box,.notice,.change,.savedItem{overflow-wrap:anywhere;word-break:break-word}.btn{max-width:100%;white-space:normal;text-align:center}@media(max-width:560px){.wrap{width:min(100% - 12px,820px)}.card{padding:15px}.actions{display:grid;grid-template-columns:1fr 1fr}.actions .btn{width:100%;min-width:0}.savedItem{grid-template-columns:minmax(0,1fr) auto}.changeBox b{overflow-wrap:anywhere}}
</style></head>
<body><div class="wrap"><div class="top"><a class="brand" href="/"><span class="logo"><svg viewbox="0 0 64 64"><path d="M32 7l4.5 9.1 10 1.5-7.2 7 1.7 9.9-9-4.8-9 4.8 1.7-9.9-7.2-7 10-1.5z" fill="#0b8d67"></path><circle cx="21" cy="40" fill="#675cc8" r="6"></circle><circle cx="43" cy="40" fill="#675cc8" r="6"></circle><circle cx="27" cy="49" fill="#675cc8" r="6"></circle><circle cx="37" cy="49" fill="#675cc8" r="6"></circle><path d="M32 43c8 0 13 7 13 11 0 3-3 5-6 5-2 0-4-1-7-1s-5 1-7 1c-3 0-6-2-6-5 0-4 5-11 13-11z" fill="#675cc8"></path></svg></span><span class="homeLabel">Северная звезда</span></a><div class="topBtns"><a class="iconBtn" href="/">На сайт</a><button class="iconBtn" id="themeBtn" type="button">☾</button></div></div><main class="card" id="root"><div class="loading">Загружаем актуальную запись…</div></main></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),STORE='sz-my-bookings';let hashParams=new URLSearchParams(location.hash.replace(/^#/,'')),token=hashParams.get('t')||new URLSearchParams(location.search).get('t')||new URLSearchParams(location.search).get('token')||'',booking=null,chosen='',lastLoaded=null;
const statusMap={new:'Ожидает подтверждения',accepted:'Подтверждена',arrived:'Вы в клинике',in_progress:'Идёт приём',completed:'Завершена',rejected:'Отклонена',no_show:'Не пришли',cancelled:'Отменена'},serviceMap={exam:'Осмотр и консультация',ultrasound:'УЗИ',xray:'Рентген',vaccination:'Вакцинация',tests:'Анализы',surgery:'Хирургия',dentistry:'Стоматология',farm:'Сельскохозяйственные животные',other:'Другое'};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dateRu(s){if(!s)return'—';try{return new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',year:'numeric'}).format(new Date(s+'T12:00:00'))}catch{return s}}async function api(url,opt){const r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Ошибка сервера');return d}function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1700)}function loadSaved(){try{return JSON.parse(localStorage.getItem(STORE)||'[]').filter(x=>x?.token).slice(0,8)}catch{return[]}}function saveSaved(a){try{localStorage.setItem(STORE,JSON.stringify(a.slice(0,8)))}catch{}}function remember(tok,b){if(!tok)return;const a=loadSaved().filter(x=>x.token!==tok);a.unshift({token:tok,id:b.id,pet:b.pet,date:b.booking_date||'',savedAt:Date.now()});saveSaved(a)}
function syncTheme(){const dark=document.documentElement.dataset.theme==='dark';$('#themeBtn').textContent=dark?'☀':'☾';document.querySelector('meta[name="theme-color"]')?.setAttribute('content',dark?'#101815':'#f6faf8')}$('#themeBtn').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'';try{localStorage.setItem('sz-theme',dark?'dark':'light')}catch{}syncTheme()};syncTheme();
function step(s){const order=['new','accepted','arrived','in_progress','completed'],i=order.indexOf(s);return i<0?0:i+1}function active(){return booking&&!['completed','rejected','no_show','cancelled'].includes(booking.status)}function when(b){return `${dateRu(b.booking_date)} · ${esc(b.booking_time)}`}function serviceName(b){const base=b.booking_type==='traumatologist'?'Приём травматолога':(serviceMap[b.service]||b.service);return b.service_interest?base+' · '+b.service_interest:base}function oldWhen(b){if(!b.previous_booking_date)return null;return `${dateRu(b.previous_booking_date)} · ${esc(b.previous_booking_time||'')}`}
function render(){const b=booking,s=step(b.status),changed=b.client_notice_at&&b.previous_booking_date;$('#root').innerHTML=`<span class="status ${esc(b.status)}">${esc(statusMap[b.status]||b.status)}</span><h1>Запись №${esc(b.id)}</h1><p class="sub">Здесь всегда отображается актуальная информация по записи для ${esc(b.pet)}.</p>${changed?`<section class="change"><h3>Клиника изменила время записи</h3><div class="changeGrid"><div class="changeBox"><small>Было</small><b>${oldWhen(b)}</b></div><span>→</span><div class="changeBox"><small>Стало</small><b>${when(b)}</b></div></div>${b.client_notice_reason?`<div class="reason"><b>Причина:</b> ${esc(b.client_notice_reason)}</div>`:''}</section>`:''}<div class="timeline">${[1,2,3,4,5].map(i=>`<i class="${i<=s?'on':''}"></i>`).join('')}</div><div class="grid"><div class="box"><small>Услуга</small><b>${esc(serviceName(b))}</b>${b.booking_type==='traumatologist'?'<small style="margin-top:5px">Стоимость определяется очно после осмотра</small>':''}</div><div class="box"><small>Дата и время</small><b>${when(b)}</b></div><div class="box"><small>Питомец</small><b>${esc(b.pet)}${b.pet_age?' · '+esc(b.pet_age):''}</b></div><div class="box"><small>Тип приёма</small><b>${b.booking_type==='traumatologist'?'Травматолог':'Обычный приём'}</b></div></div>${b.status==='new'?'<div class="notice">Заявка ожидает подтверждения клиникой.</div>':''}${b.status==='cancelled'?'<div class="notice error">Эта запись отменена.</div>':''}${b.status==='completed'?'<div class="notice">Приём завершён.</div>':''}<div id="actionError" class="inlineError"></div><div class="actions">${active()?'<button id="resBtn" class="btn primary">Перенести</button>':''}${active()?'<button id="cancelBtn" class="btn danger">Отменить</button>':''}<button id="shareBtn" class="btn secondary">Поделиться</button><a class="btn secondary" href="tel:+79116480644">Позвонить</a></div><div id="resPanel" class="panel"><b>Новое время</b><input id="newDate" class="input" type="date" style="margin-top:8px"><div id="slots" class="slots"><div class="empty">Сначала выберите дату</div></div><button id="saveRes" class="btn primary" style="margin-top:9px" disabled>Отправить перенос</button></div><div id="cancelBox" class="confirmBox"><p>Отменить запись? После отмены это время снова станет доступно другим клиентам.</p><div class="actions"><button id="confirmCancel" class="btn danger">Да, отменить</button><button id="closeCancel" class="btn secondary">Не отменять</button></div></div><div class="sync">${lastLoaded?'Обновлено '+lastLoaded.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):''}</div>`;if($('#resBtn'))$('#resBtn').onclick=()=>{$('#resPanel').classList.toggle('show');$('#newDate').min=today()};if($('#newDate'))$('#newDate').onchange=loadSlots;if($('#saveRes'))$('#saveRes').onclick=reschedule;if($('#cancelBtn'))$('#cancelBtn').onclick=()=>$('#cancelBox').classList.add('show');if($('#closeCancel'))$('#closeCancel').onclick=()=>$('#cancelBox').classList.remove('show');if($('#confirmCancel'))$('#confirmCancel').onclick=cancelBooking;$('#shareBtn').onclick=shareBooking}
function showError(t){const e=$('#actionError');if(!e)return;e.textContent=t;e.classList.add('show')}async function loadSlots(){chosen='';const box=$('#slots');$('#saveRes').disabled=true;box.innerHTML='<div class="empty">Загружаем…</div>';try{const d=await api('/.netlify/functions/get-available-slots?date='+encodeURIComponent($('#newDate').value),{cache:'no-store'});box.innerHTML=d.slots.length?d.slots.map(t=>`<button class="slot" type="button" data-time="${t}">${t}</button>`).join(''):'<div class="empty">Свободного времени нет</div>';document.querySelectorAll('.slot').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.slot').forEach(x=>x.classList.remove('on'));btn.classList.add('on');chosen=btn.dataset.time;$('#saveRes').disabled=false})}catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function reschedule(){if(!chosen)return;const btn=$('#saveRes');btn.disabled=true;try{await api('/.netlify/functions/public-booking',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'reschedule',token,booking_date:$('#newDate').value,booking_time:chosen})});toast('Перенос отправлен');await load()}catch(e){showError(e.message);btn.disabled=false}}async function cancelBooking(){const btn=$('#confirmCancel');btn.disabled=true;try{await api('/.netlify/functions/public-booking',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'cancel',token})});toast('Запись отменена');await load()}catch(e){showError(e.message);btn.disabled=false}}async function shareBooking(){const url=location.origin+'/booking.html#t='+encodeURIComponent(token);try{if(navigator.share)await navigator.share({title:'Моя запись — Северная звезда',text:`Запись №${booking.id} для ${booking.pet}`,url});else{await navigator.clipboard.writeText(url);toast('Ссылка скопирована')}}catch{}}
async function chooser(){const a=loadSaved();if(!a.length){$('#root').innerHTML='<div class="loading"><b>Сохранённых записей на этом устройстве нет.</b><br><br><a class="btn primary" href="/">Записаться</a></div>';return}$('#root').innerHTML='<h1>Мои записи</h1><p class="sub">Проверяем актуальные статусы…</p><div id="saved" class="savedList">'+a.map(()=>'<div class="empty">Загрузка…</div>').join('')+'</div>';const rows=await Promise.all(a.map(async x=>{try{const d=await api('/.netlify/functions/public-booking',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'read',token:x.token}),cache:'no-store'});return{x,b:d.booking}}catch(e){return{x,error:e.message}}}));const valid=rows.filter(r=>r.b).map(r=>({token:r.x.token,id:r.b.id,pet:r.b.pet,date:r.b.booking_date||'',savedAt:r.x.savedAt||Date.now()}));if(valid.length)saveSaved(valid);$('#saved').innerHTML=rows.map(r=>r.b?`<a class="savedItem" href="/booking.html#t=${encodeURIComponent(r.x.token)}"><div><b>${esc(r.b.pet)} · №${esc(r.b.id)}</b><br><small>${esc(serviceName(r.b))} · ${dateRu(r.b.booking_date)} · ${esc(statusMap[r.b.status]||r.b.status)}</small></div><span>→</span></a>`:`<div class="savedItem"><div><b>${esc(r.x.pet||'Запись')}</b><br><small>${esc(r.error||'Не удалось загрузить')}</small></div><button class="btn secondary" onclick="chooser()">Повторить</button></div>`).join('')}
async function load(){if(!token)return chooser();try{const d=await api('/.netlify/functions/public-booking',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'read',token}),cache:'no-store'});booking=d.booking;lastLoaded=new Date();remember(token,booking);render()}catch(e){$('#root').innerHTML=`<div class="loading"><b>${esc(e.message)}</b><br><br><button class="btn secondary" onclick="load()">Повторить</button> <a class="btn primary" href="tel:+79116480644">Позвонить</a></div>`}}window.load=load;window.chooser=chooser;load();document.addEventListener('visibilitychange',()=>{if(!document.hidden&&token)load()});setInterval(()=>{if(!document.hidden&&token&&booking)load()},45000);
</script></body></html>
