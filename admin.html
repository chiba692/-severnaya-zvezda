<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15241f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/admin-manifest.webmanifest"><link rel="icon" href="/icons/admin-icon.svg"><title>Северная звезда Admin</title>
<style>
:root{--ink:#17221e;--muted:#68766f;--mint:#20bd8f;--mint2:#0e9872;--lav:#8c7cf0;--red:#e75d51;--line:#e7ede9;--bg:#f3f8f5;--card:rgba(255,255,255,.92)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 0,#dff8ed,transparent 28%),radial-gradient(circle at 100% 0,#ece8ff,transparent 25%),var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);min-height:100vh}button,input,select,textarea{font:inherit}.shell{max-width:1160px;margin:auto;padding:18px}.topbar{position:sticky;top:8px;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 15px;background:rgba(255,255,255,.78);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.9);border-radius:20px;box-shadow:0 12px 40px rgba(35,65,53,.08)}.brand{font-weight:900}.brand small{display:block;color:var(--muted);font-weight:700}.actions,.tabs,.filters,.cardactions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:850;cursor:pointer}.primary{background:linear-gradient(135deg,var(--mint),var(--mint2));color:white}.ghost{background:#eef4f0;color:#435149}.danger{background:#fff0ee;color:#b8473d}.login{max-width:430px;margin:10vh auto;padding:28px;border-radius:28px;background:rgba(255,255,255,.86);backdrop-filter:blur(18px);box-shadow:0 25px 70px rgba(30,60,48,.12)}.login h1{margin:0 0 8px}.login p{color:var(--muted)}.input{width:100%;border:2px solid var(--line);border-radius:13px;padding:12px 13px;margin:5px 0;outline:0;background:#fff}.input:focus{border-color:var(--mint);box-shadow:0 0 0 4px #e4f9f1}.panel{display:none}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin:28px 2px 16px}.hero h1{margin:0;font-size:32px}.hero p{margin:5px 0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px 0}.stat{background:var(--card);border:1px solid #fff;border-radius:18px;padding:16px;box-shadow:0 8px 30px rgba(30,60,48,.05)}.stat b{font-size:26px}.stat span{display:block;color:var(--muted);font-size:12px;font-weight:750}.tabs{margin:12px 0}.tab,.filter{border:0;background:#fff;border-radius:999px;padding:9px 13px;font-weight:800;white-space:nowrap;cursor:pointer}.tab.on,.filter.on{background:#17221e;color:#fff}.tools{display:grid;grid-template-columns:1fr auto;gap:10px;margin:14px 0}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.card{background:var(--card);border:1px solid #fff;border-radius:22px;padding:18px;box-shadow:0 10px 35px rgba(30,60,48,.06)}.cardtop{display:flex;justify-content:space-between;gap:12px}.name{font-size:18px;font-weight:900}.pet{color:var(--muted);margin-top:3px}.when{padding:8px 10px;background:#efedff;color:#6254c7;border-radius:12px;font-weight:850;font-size:13px;height:max-content}.badge{display:inline-block;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:900;margin-top:10px}.new{background:#fff2d9;color:#95600a}.accepted{background:#e7f9f2;color:#087657}.completed{background:#edf0f2;color:#58636a}.rejected,.no_show{background:#fff0ee;color:#a7443a}.svc{background:#eef4f0;color:#435149}.svc-vaccination{background:#fff0f4;color:#a63d63}.svc-inpatient{background:#e9f2ff;color:#3563a8}.svc-xray{background:#f0edff;color:#6254c7}.svc-ultrasound{background:#e7fbff;color:#19768a}.svc-tests{background:#fff6df;color:#916514}.meta{display:grid;gap:6px;margin:13px 0}.meta a{color:var(--mint2);font-weight:850;text-decoration:none}.comment,.details{padding:10px 11px;background:#f5f8f6;border-radius:11px;color:#526059;margin:9px 0;font-size:13px}.cardactions .btn{padding:8px 10px;font-size:12px}.empty{grid-column:1/-1;padding:45px;text-align:center;background:#fff;border-radius:20px;color:var(--muted)}
.calendarHead{display:flex;justify-content:space-between;align-items:center;margin:10px 0}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.weekday{text-align:center;color:var(--muted);font-size:12px;font-weight:800;padding:5px}.day{min-height:115px;background:#fff;border-radius:15px;padding:9px;border:1px solid #edf1ee}.day.muted{opacity:.38}.day.today{box-shadow:0 0 0 2px var(--mint)}.daynum{font-weight:900}.event{margin-top:6px;padding:5px 7px;border-radius:8px;background:#eef8f4;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.agenda{display:grid;gap:10px}.agendaItem{display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:12px;padding:14px;background:#fff;border-radius:16px}.agendaTime{font-weight:950;font-size:17px;color:#6254c7}.agendaItem small{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#17221e;color:#fff;padding:12px 16px;border-radius:14px;transition:.2s;z-index:100}.toast.show{opacity:1;transform:translateX(-50%)}dialog{border:0;border-radius:22px;padding:0;width:min(560px,calc(100% - 24px));box-shadow:0 30px 100px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(20,30,26,.42);backdrop-filter:blur(4px)}.modal{padding:21px}.modal h2{margin:0 0 13px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.modalfooter{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.error{display:none;background:#fff0ee;color:#a7443a;padding:10px;border-radius:11px;margin:9px 0}.historyRow{padding:12px 0;border-bottom:1px solid var(--line)}.historyRow:last-child{border:0}
@media(max-width:800px){.shell{padding:11px}.stats{grid-template-columns:repeat(2,1fr)}.list{grid-template-columns:1fr}.tools{grid-template-columns:1fr}.topbar .label{display:none}.hero{display:block}.hero h1{font-size:28px}.calendar{gap:3px}.day{min-height:82px;padding:6px}.event{font-size:9px}.weekday{font-size:10px}.agendaItem{grid-template-columns:58px 1fr}.agendaItem .btn{grid-column:2}.grid2{grid-template-columns:1fr}.cardactions .btn{flex:1}}
</style></head><body>
<div id="loginView" class="shell"><form id="loginForm" class="login"><div style="font-size:42px">🐾</div><h1>Северная звезда</h1><p>Приложение администратора клиники</p><div id="loginError" class="error"></div><input id="login" class="input" placeholder="Логин" autocomplete="username" required><input id="password" class="input" type="password" placeholder="Пароль" autocomplete="current-password" required><button id="loginBtn" class="btn primary" style="width:100%;margin-top:8px">Войти</button></form></div>

<div id="panel" class="panel"><div class="shell"><div class="topbar"><div class="brand">🐾 Северная звезда<small>Администратор</small></div><div class="actions"><button id="installBtn" class="btn ghost" hidden>📲 <span class="label">Установить</span></button><button id="refreshBtn" class="btn ghost">↻ <span class="label">Обновить</span></button><button id="logoutBtn" class="btn ghost">Выйти</button></div></div>
<div class="hero"><div><h1 id="viewTitle">Заявки</h1><p id="syncText">Загружаем данные…</p></div><button id="addBtn" class="btn primary">＋ Новая запись</button></div>
<div class="stats"><div class="stat"><b id="sAll">0</b><span>Всего</span></div><div class="stat"><b id="sNew">0</b><span>Новые</span></div><div class="stat"><b id="sToday">0</b><span>Сегодня</span></div><div class="stat"><b id="sAccepted">0</b><span>Приняты</span></div><div class="stat"><b id="sInpatient">0</b><span>Стационар</span></div></div>
<div class="tabs"><button class="tab on" data-view="list">Список</button><button class="tab" data-view="today">Сегодня</button><button class="tab" data-view="calendar">Календарь</button></div>
<div id="listControls"><div class="tools"><input id="search" class="input" placeholder="Поиск: имя, питомец, телефон…"><div class="filters"><button class="filter on" data-filter="all">Все</button><button class="filter" data-filter="new">Новые</button><button class="filter" data-filter="accepted">Приняты</button><button class="filter" data-filter="completed">Завершены</button><button class="filter" data-filter="rejected">Отклонены</button><button class="filter" data-filter="no_show">Не пришли</button></div></div></div>
<div id="listView" class="list"></div>
<div id="todayView" style="display:none"><div id="agenda" class="agenda"></div></div>
<div id="calendarView" style="display:none"><div class="calendarHead"><button id="prevMonth" class="btn ghost">←</button><strong id="monthLabel"></strong><button id="nextMonth" class="btn ghost">→</button></div><div id="calendar" class="calendar"></div></div>
</div></div>

<dialog id="editDialog"><form id="editForm" class="modal"><h2 id="modalTitle">Запись</h2><input id="editId" type="hidden"><div class="grid2"><input id="eOwner" class="input" placeholder="Имя" required><input id="ePhone" class="input" placeholder="Телефон" required></div><input id="ePet" class="input" placeholder="Питомец" required><div class="grid2"><select id="ePetSpecies" class="input"><option value="cat">Кошка</option><option value="dog">Собака</option><option value="other">Другой питомец</option></select><input id="ePetAge" class="input" placeholder="Возраст"></div>
<select id="eService" class="input"><option value="exam">Осмотр</option><option value="ultrasound">УЗИ</option><option value="xray">Рентген</option><option value="vaccination">Вакцинация</option><option value="tests">Анализы</option><option value="inpatient">Стационар</option><option value="other">Другое</option></select><div id="adminServiceDetails"></div>
<div id="regularFields" class="grid2"><input id="eDate" class="input" type="date"><select id="eTime" class="input"><option value="">Выберите время</option></select></div>
<div id="stayFields" class="grid2" style="display:none"><input id="eStayStart" class="input" type="date"><input id="eStayEnd" class="input" type="date"></div>
<textarea id="eComment" class="input" rows="3" placeholder="Комментарий"></textarea><div id="editError" class="error"></div><div class="modalfooter"><button type="button" id="cancelEdit" class="btn ghost">Отмена</button><button class="btn primary">Сохранить</button></div></form></dialog>

<dialog id="historyDialog"><div class="modal"><h2 id="historyTitle">История клиента</h2><div id="historyList"></div><div class="modalfooter"><button id="closeHistory" class="btn ghost">Закрыть</button></div></div></dialog>
<div id="toast" class="toast"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let data=[],filter='all',view='list',installPrompt=null,calDate=new Date();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function today(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function statusText(s){return ({new:'Новая',accepted:'Принята',completed:'Завершена',rejected:'Отклонена',no_show:'Не пришли'})[s]||'Новая'}
function serviceText(s){return ({exam:'Осмотр',ultrasound:'УЗИ',xray:'Рентген',vaccination:'Вакцинация',tests:'Анализы',inpatient:'Стационар',other:'Другое'})[s]||'Осмотр'}
function speciesText(s){return ({cat:'Кошка',dog:'Собака',other:'Другой питомец'})[s]||'—'}
function detailText(b){const d=b.service_details||{};if(b.service==='vaccination'){const v=({unknown:'Не указано',complex:'Комплексная',rabies:'Бешенство',primary:'Первая вакцинация',revaccination:'Ревакцинация'})[d.vaccine_type]||d.vaccine_type||'Не указано';return `Вакцинация: ${v}${d.last_vaccine_date?' · предыдущая '+d.last_vaccine_date:''}`}if(b.service==='ultrasound'&&d.area)return 'УЗИ: '+d.area;if(b.service==='xray'&&d.area)return 'Рентген: '+d.area;if(b.service==='tests')return 'Анализы: '+(({unknown:'Не указано',cbc:'Общий анализ крови',biochem:'Биохимия',urine:'Анализ мочи',other:'Другие'})[d.test_type]||d.test_type||'Не указано');if(b.service==='inpatient'&&d.care)return 'Уход: '+d.care;if(b.service==='other'&&d.reason)return 'Запрос: '+d.reason;return ''}
function normalize(b){return {...b,status:b.status||'new',service:b.service||'exam',booking_time:String(b.booking_time||'').slice(0,5),service_details:b.service_details||{}}}
async function api(url,opt){let r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(r.status===401){showLogin();throw Error('Сессия закончилась')}if(!r.ok)throw Error(d.error||'Ошибка сервера');return d}
function showLogin(){$('#panel').style.display='none';$('#loginView').style.display='block'}function showPanel(){$('#loginView').style.display='none';$('#panel').style.display='block'}
async function load(silent=false){try{let d=await api('/.netlify/functions/get-bookings',{cache:'no-store'});data=(d.bookings||[]).map(normalize);showPanel();renderAll();$('#syncText').textContent='Обновлено '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});if(!silent)toast('Обновлено')}catch(e){if(!silent)toast(e.message)}}
function renderStats(){$('#sAll').textContent=data.length;$('#sNew').textContent=data.filter(x=>x.status==='new').length;$('#sToday').textContent=data.filter(x=>x.booking_date===today()).length;$('#sAccepted').textContent=data.filter(x=>x.status==='accepted').length;$('#sInpatient').textContent=data.filter(x=>x.service==='inpatient'&&x.status!=='completed'&&x.status!=='rejected').length}
function cardHtml(b){return `<article class="card"><div class="cardtop"><div><div class="name">${esc(b.owner_name||'Без имени')}</div><div class="pet">🐾 ${esc(b.pet||'Питомец')} · ${esc(speciesText(b.pet_species))}${b.pet_age?` · ${esc(b.pet_age)}`:''}</div></div><div class="when">${b.service==='inpatient'?`🏥 ${esc(b.stay_start||b.booking_date)} → ${esc(b.stay_end||'?')}`:`${esc(b.booking_date)} · ${esc(b.booking_time)}`}</div></div><span class="badge ${esc(b.status)}">${statusText(b.status)}</span> <span class="badge svc svc-${esc(b.service)}">${esc(serviceText(b.service))}</span>${b.booking_type==='traumatologist'?' <span class="badge accepted">👨‍⚕️ Травматолог</span>':''}<div class="meta"><div>📞 <a href="tel:${esc(b.phone)}">${esc(b.phone||'—')}</a></div></div>${detailText(b)?`<div class="details">${esc(detailText(b))}</div>`:''}${b.comment?`<div class="comment">💬 ${esc(b.comment)}</div>`:''}<div class="cardactions">${b.status==='new'?`<button class="btn primary" onclick="setStatus('${b.id}','accepted')">Принять</button><button class="btn danger" onclick="setStatus('${b.id}','rejected')">Отклонить</button>`:''}${b.status==='accepted'?`<button class="btn primary" onclick="setStatus('${b.id}','completed')">Завершить</button><button class="btn danger" onclick="setStatus('${b.id}','no_show')">Не пришли</button>`:''}<button class="btn ghost" onclick="openEdit('${b.id}')">✏️ Изменить</button><button class="btn ghost" onclick="repeatBooking('${b.id}')">↻ Повторить</button><button class="btn ghost" onclick="showHistory('${b.id}')">🕘 История</button><button class="btn ghost" onclick="removeBooking('${b.id}')">🗑</button></div></article>`}
function renderList(){let q=$('#search').value.trim().toLowerCase();let arr=data.filter(b=>(filter==='all'||b.status===filter)&&(!q||[b.owner_name,b.pet,b.phone,b.comment,serviceText(b.service)].join(' ').toLowerCase().includes(q)));$('#listView').innerHTML=arr.length?arr.map(cardHtml).join(''):'<div class="empty">Подходящих заявок нет 🐾</div>'}
function renderToday(){let arr=data.filter(b=>b.booking_date===today()&&b.status!=='rejected').sort((a,b)=>a.booking_time.localeCompare(b.booking_time));$('#agenda').innerHTML=arr.length?arr.map(b=>`<div class="agendaItem"><div class="agendaTime">${b.service==='inpatient'?'🏥':esc(b.booking_time)}</div><div><strong>${esc(b.pet)} · ${esc(serviceText(b.service))}</strong><br><small>${esc(b.owner_name)} · ${esc(b.phone)} · ${statusText(b.status)}</small></div><button class="btn ghost" onclick="openEdit('${b.id}')">Открыть</button></div>`).join(''):'<div class="empty">На сегодня записей нет</div>'}
function ym(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}function renderCalendar(){const y=calDate.getFullYear(),m=calDate.getMonth();$('#monthLabel').textContent=new Intl.DateTimeFormat('ru-RU',{month:'long',year:'numeric'}).format(calDate);let first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate(),cells=[];['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(x=>cells.push(`<div class="weekday">${x}</div>`));for(let i=0;i<42;i++){let n=i-start+1,cm=m,cy=y,muted=false;if(n<1){n=prevDays+n;cm=m-1;muted=true}else if(n>days){n=n-days;cm=m+1;muted=true}let d=new Date(cy,cm,n),ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),events=data.filter(b=>b.booking_date===ds&&b.status!=='rejected');cells.push(`<div class="day ${muted?'muted':''} ${ds===today()?'today':''}"><div class="daynum">${n}</div>${events.slice(0,4).map(b=>`<div class="event" onclick="openEdit('${b.id}')">${b.service==='inpatient'?'🏥':esc(b.booking_time)} ${esc(b.pet)}</div>`).join('')}${events.length>4?`<div class="event">+${events.length-4}</div>`:''}</div>`)}$('#calendar').innerHTML=cells.join('')}
function renderAll(){renderStats();renderList();renderToday();renderCalendar()}
async function action(body){await api('/.netlify/functions/manage-booking',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});await load(true)}
window.setStatus=async(id,status)=>{try{await action({action:'status',id,status});toast('Статус изменён')}catch(e){toast(e.message)}};window.removeBooking=async id=>{if(!confirm('Удалить запись?'))return;try{await action({action:'delete',id});toast('Удалено')}catch(e){toast(e.message)}}
async function loadTimes(date,selected=''){let s=$('#eTime');s.innerHTML='<option value="">Загружаем…</option>';try{let d=await api('/.netlify/functions/get-available-slots?date='+encodeURIComponent(date),{cache:'no-store'}),times=d.slots||[];if(selected&&!times.includes(selected))times.unshift(selected);s.innerHTML='<option value="">Выберите время</option>'+times.map(t=>`<option ${t===selected?'selected':''}>${esc(t)}</option>`).join('')}catch(e){s.innerHTML='<option value="">Ошибка расписания</option>'}}
function adminDetails(service,d={}){const box=$('#adminServiceDetails');if(service==='vaccination')box.innerHTML=`<div class="grid2"><select id="aVaccineType" class="input"><option value="unknown">Не знаю</option><option value="complex">Комплексная</option><option value="rabies">Бешенство</option><option value="primary">Первая вакцинация</option><option value="revaccination">Ревакцинация</option></select><input id="aLastVaccineDate" class="input" type="date"></div>`;else if(service==='ultrasound')box.innerHTML=`<input id="aArea" class="input" placeholder="Область УЗИ">`;else if(service==='xray')box.innerHTML=`<input id="aArea" class="input" placeholder="Область рентгена">`;else if(service==='tests')box.innerHTML=`<select id="aTestType" class="input"><option value="unknown">Не знаю</option><option value="cbc">Общий анализ крови</option><option value="biochem">Биохимия</option><option value="urine">Анализ мочи</option><option value="other">Другие</option></select>`;else if(service==='inpatient')box.innerHTML=`<textarea id="aCare" class="input" rows="3" placeholder="Особенности ухода"></textarea>`;else if(service==='other')box.innerHTML=`<input id="aReason" class="input" placeholder="Что нужно">`;else box.innerHTML='';if(service==='vaccination'){if($('#aVaccineType'))$('#aVaccineType').value=d.vaccine_type||'unknown';if($('#aLastVaccineDate'))$('#aLastVaccineDate').value=d.last_vaccine_date||''}if(['ultrasound','xray'].includes(service)&&$('#aArea'))$('#aArea').value=d.area||'';if(service==='tests'&&$('#aTestType'))$('#aTestType').value=d.test_type||'unknown';if(service==='inpatient'&&$('#aCare'))$('#aCare').value=d.care||'';if(service==='other'&&$('#aReason'))$('#aReason').value=d.reason||''}
function readDetails(service){if(service==='vaccination')return{vaccine_type:$('#aVaccineType')?.value||'unknown',last_vaccine_date:$('#aLastVaccineDate')?.value||null};if(['ultrasound','xray'].includes(service))return{area:$('#aArea')?.value.trim()||''};if(service==='tests')return{test_type:$('#aTestType')?.value||'unknown'};if(service==='inpatient')return{care:$('#aCare')?.value.trim()||''};if(service==='other')return{reason:$('#aReason')?.value.trim()||''};return{}}
function toggleAdminService(details={}){const inp=$('#eService').value==='inpatient';adminDetails($('#eService').value,details);$('#regularFields').style.display=inp?'none':'grid';$('#stayFields').style.display=inp?'grid':'none';$('#eDate').required=!inp;$('#eTime').required=!inp;$('#eStayStart').required=inp;$('#eStayEnd').required=inp}
window.openEdit=async id=>{let b=data.find(x=>String(x.id)===String(id));$('#modalTitle').textContent='Изменить запись';$('#editId').value=b.id;$('#eOwner').value=b.owner_name||'';$('#ePhone').value=b.phone||'';$('#ePet').value=b.pet||'';$('#ePetSpecies').value=b.pet_species||'other';$('#ePetAge').value=b.pet_age||'';$('#eService').value=b.service||'exam';$('#eDate').value=b.booking_date||'';$('#eStayStart').value=b.stay_start||'';$('#eStayEnd').value=b.stay_end||'';$('#eComment').value=b.comment||'';toggleAdminService(b.service_details||{});if(b.service!=='inpatient')await loadTimes(b.booking_date,b.booking_time);$('#editDialog').showModal()}
function newForm(b=null){$('#editForm').reset();$('#editId').value='';$('#modalTitle').textContent=b?'Повторная запись':'Новая запись';$('#ePetSpecies').value=b?.pet_species||'cat';$('#eOwner').value=b?.owner_name||'';$('#ePhone').value=b?.phone||'';$('#ePet').value=b?.pet||'';$('#ePetAge').value=b?.pet_age||'';$('#eService').value=b?.service||'exam';toggleAdminService(b?.service_details||{});$('#eTime').innerHTML='<option value="">Сначала выберите дату</option>';$('#editDialog').showModal()}
window.repeatBooking=id=>newForm(data.find(x=>String(x.id)===String(id)));$('#addBtn').onclick=()=>newForm();$('#eService').onchange=()=>toggleAdminService({});$('#eDate').onchange=()=>loadTimes($('#eDate').value);$('#cancelEdit').onclick=()=>$('#editDialog').close();
$('#editForm').onsubmit=async e=>{e.preventDefault();$('#editError').style.display='none';let inp=$('#eService').value==='inpatient',svc=$('#eService').value;let body={action:$('#editId').value?'edit':'create',id:$('#editId').value||undefined,owner_name:$('#eOwner').value.trim(),phone:$('#ePhone').value.trim(),pet:$('#ePet').value.trim(),pet_species:$('#ePetSpecies').value,pet_age:$('#ePetAge').value.trim(),service:svc,service_details:readDetails(svc),booking_date:inp?$('#eStayStart').value:$('#eDate').value,booking_time:inp?'00:00':$('#eTime').value,stay_start:inp?$('#eStayStart').value:null,stay_end:inp?$('#eStayEnd').value:null,comment:$('#eComment').value.trim()};try{await action(body);$('#editDialog').close();toast(body.id?'Запись изменена':'Запись создана')}catch(err){$('#editError').textContent=err.message;$('#editError').style.display='block'}}
window.showHistory=id=>{let b=data.find(x=>String(x.id)===String(id)),h=data.filter(x=>x.phone&&b.phone&&x.phone.replace(/\D/g,'')===b.phone.replace(/\D/g,'')).sort((a,b)=>String(b.booking_date).localeCompare(String(a.booking_date)));$('#historyTitle').textContent=`История: ${b.owner_name}`;$('#historyList').innerHTML=h.length?h.map(x=>`<div class="historyRow"><strong>${esc(x.booking_date)} · ${esc(serviceText(x.service))}</strong><br><span>${esc(x.pet)} · ${statusText(x.status)}</span>${x.comment?`<br><small>${esc(x.comment)}</small>`:''}</div>`).join(''):'История пуста';$('#historyDialog').showModal()};$('#closeHistory').onclick=()=>$('#historyDialog').close();
$('#loginForm').onsubmit=async e=>{e.preventDefault();let b=$('#loginBtn'),er=$('#loginError');er.style.display='none';b.disabled=true;b.textContent='Входим…';try{await api('/.netlify/functions/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:$('#login').value,password:$('#password').value})});$('#password').value='';await load(true)}catch(x){er.textContent=x.message;er.style.display='block'}finally{b.disabled=false;b.textContent='Войти'}}
$('#logoutBtn').onclick=async()=>{await fetch('/.netlify/functions/admin-logout',{method:'POST'});showLogin()};$('#refreshBtn').onclick=()=>load();$('#search').oninput=renderList;$$('.filter').forEach(b=>b.onclick=()=>{$$('.filter').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.filter;renderList()});
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');view=b.dataset.view;$('#listView').style.display=view==='list'?'grid':'none';$('#listControls').style.display=view==='list'?'block':'none';$('#todayView').style.display=view==='today'?'block':'none';$('#calendarView').style.display=view==='calendar'?'block':'none';$('#viewTitle').textContent=view==='list'?'Заявки':view==='today'?'Сегодня':'Календарь';if(view==='today')renderToday();if(view==='calendar')renderCalendar()});
$('#prevMonth').onclick=()=>{calDate=new Date(calDate.getFullYear(),calDate.getMonth()-1,1);renderCalendar()};$('#nextMonth').onclick=()=>{calDate=new Date(calDate.getFullYear(),calDate.getMonth()+1,1);renderCalendar()};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('#installBtn').hidden=false});$('#installBtn').onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('#installBtn').hidden=true}};if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');document.addEventListener('visibilitychange',()=>{if(!document.hidden&&$('#panel').style.display==='block')load(true)});setInterval(()=>{if(!document.hidden&&$('#panel').style.display==='block')load(true)},30000);load(true);
</script></body></html>
