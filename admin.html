<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заявки — Северное сияние</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: #f6faf8;
    color: #20262b;
    font-family: Arial, sans-serif;
  }
  .header {
    background: white;
    padding: 22px 20px;
    border-bottom: 1px solid #e7eee9;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-inner {
    max-width: 720px;
    margin: auto;
  }
  .logo {
    font-size: 22px;
    font-weight: 800;
    color: #1fbe8f;
  }
  .subtitle {
    margin-top: 4px;
    color: #68747d;
    font-size: 14px;
  }
  .wrap {
    max-width: 720px;
    margin: auto;
    padding: 24px 18px 50px;
  }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 22px;
  }
  h1 {
    margin: 0;
    font-size: 28px;
  }
  .count {
    background: #e7faf3;
    color: #0d8b67;
    padding: 8px 13px;
    border-radius: 999px;
    font-weight: 700;
    white-space: nowrap;
  }
  .empty {
    background: white;
    border-radius: 20px;
    padding: 40px 20px;
    text-align: center;
    color: #7a858d;
    box-shadow: 0 4px 18px rgba(0,0,0,.05);
  }
  .booking {
    background: white;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 14px;
    box-shadow: 0 4px 18px rgba(0,0,0,.06);
  }
  .booking-top {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: flex-start;
  }
  .name {
    font-size: 19px;
    font-weight: 800;
  }
  .pet {
    margin-top: 3px;
    color: #68747d;
  }
  .date {
    background: #f1efff;
    color: #6658d8;
    padding: 7px 10px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
  }
  .info {
    margin-top: 18px;
    display: grid;
    gap: 9px;
  }
  .info-row {
    display: flex;
    gap: 8px;
  }
  .label {
    color: #89939b;
    min-width: 90px;
  }
  .comment {
    margin-top: 15px;
    padding: 12px;
    background: #f8f9f8;
    border-radius: 12px;
    color: #4f5960;
  }
  .refresh {
    border: 0;
    background: #1fbe8f;
    color: white;
    padding: 10px 15px;
    border-radius: 999px;
    font-weight: 700;
    cursor: pointer;
  }
  .refresh:disabled {
    opacity: .6;
  }
  .error {
    background: #fff0ed;
    color: #b8493a;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 15px;
    display: none;
  }
  @media (max-width: 520px) {
    .booking-top {
      flex-direction: column;
    }
    .date {
      align-self: flex-start;
    }
    .info-row {
      flex-direction: column;
      gap: 2px;
    }
  }
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div class="logo">🐾 Северное сияние</div>
    <div class="subtitle">Панель заявок</div>
  </div>
</header>
<main class="wrap">
  <div class="top">
    <h1>Заявки</h1>
    <div class="count" id="count">0 заявок</div>
  </div>
  <button class="refresh" id="refreshBtn">
    Обновить заявки
  </button>
  <div class="error" id="error"></div>
  <div id="bookings" style="margin-top:20px;">
    <div class="empty">
      Загружаем заявки...
    </div>
  </div>
</main>
<script>
async function loadBookings() {
  const container = document.getElementById('bookings');
  const count = document.getElementById('count');
  const error = document.getElementById('error');
  const refreshBtn = document.getElementById('refreshBtn');
  error.style.display = 'none';
  refreshBtn.disabled = true;
  refreshBtn.textContent = 'Загружаем...';
  try {
    const response = await fetch('/.netlify/functions/get-bookings');
    const data = await response.json();
    if (!response.ok) {
      throw new Error(data.error || 'Не удалось загрузить заявки');
    }
    const bookings = data.bookings || [];
    count.textContent =
      bookings.length +
      (bookings.length === 1 ? ' заявка' :
       bookings.length < 5 ? ' заявки' : ' заявок');
    if (!bookings.length) {
      container.innerHTML = `
        <div class="empty">
          Пока заявок нет 🐾
        </div>
      `;
      return;
    }
    container.innerHTML = bookings.map(function (booking) {
      return `
        <div class="booking">
          <div class="booking-top">
            <div>
              <div class="name">
                ${escapeHtml(booking.owner_name || 'Без имени')}
              </div>
              <div class="pet">
                🐾 ${escapeHtml(booking.pet || 'Животное не указано')}
              </div>
            </div>
            <div class="date">
              ${escapeHtml(booking.booking_date || '')}
              ${escapeHtml(booking.booking_time || '')}
            </div>
          </div>
          <div class="info">
            <div class="info-row">
              <span class="label">Телефон:</span>
              <strong>
                ${escapeHtml(booking.phone || '—')}
              </strong>
            </div>
            <div class="info-row">
              <span class="label">Дата:</span>
              <span>
                ${escapeHtml(booking.booking_date || '—')}
              </span>
            </div>
            <div class="info-row">
              <span class="label">Время:</span>
              <span>
                ${escapeHtml(booking.booking_time || '—')}
              </span>
            </div>
          </div>
          ${
            booking.comment
              ? `
                <div class="comment">
                  💬 ${escapeHtml(booking.comment)}
                </div>
              `
              : ''
          }
        </div>
      `;
    }).join('');
  } catch (err) {
    console.error(err);
    error.textContent =
      err.message || 'Ошибка загрузки заявок';
    error.style.display = 'block';
    container.innerHTML = `
      <div class="empty">
        Не удалось загрузить заявки.
      </div>
    `;
  } finally {
    refreshBtn.disabled = false;
    refreshBtn.textContent = 'Обновить заявки';
  }
}
function escapeHtml(value) {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
document
  .getElementById('refreshBtn')
  .addEventListener('click', loadBookings);
loadBookings();
</script>
</body>
</html>
