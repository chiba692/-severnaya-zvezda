<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15241f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/admin-manifest.webmanifest"><link rel="icon" href="/icons/admin-icon.svg">
<title>Северная звезда Admin</title>
<style>
:root{--ink:#17221e;--muted:#68766f;--mint:#20bd8f;--mint2:#0e9872;--lav:#8c7cf0;--red:#e75d51;--amber:#d49324;--line:#e7ede9;--bg:#f3f8f5;--card:rgba(255,255,255,.9)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 0,#dff8ed,transparent 28%),radial-gradient(circle at 100% 0,#ece8ff,transparent 25%),var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);min-height:100vh}button,input,select,textarea{font:inherit}.shell{max-width:1100px;margin:auto;padding:20px}.topbar{position:sticky;top:10px;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.72);backdrop-filter:blur(18px);border-radius:22px;box-shadow:0 12px 40px rgba(35,65,53,.08)}.brand{font-weight:900}.brand small{display:block;color:var(--muted);font-weight:700}.actions{display:flex;gap:8px}.btn{border:0;border-radius:13px;padding:11px 14px;font-weight:850;cursor:pointer}.primary{background:linear-gradient(135deg,var(--mint),var(--mint2));color:white}.ghost{background:#eef4f0;color:#435149}.danger{background:#fff0ee;color:#b8473d}.login{max-width:430px;margin:10vh auto;padding:28px;border-radius:28px;background:rgba(255,255,255,.86);backdrop-filter:blur(18px);box-shadow:0 25px 70px rgba(30,60,48,.12)}.login h1{margin:0 0 8px}.login p{color:var(--muted)}.input{width:100%;border:2px solid var(--line);border-radius:14px;padding:13px;margin:6px 0;outline:0;background:#fff}.input:focus{border-color:var(--mint);box-shadow:0 0 0 4px #e4f9f1}.panel{display:none}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin:30px 2px 18px}.hero h1{margin:0;font-size:34px}.hero p{margin:5px 0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat{background:var(--card);border:1px solid rgba(255,255,255,.9);border-radius:20px;padding:18px;box-shadow:0 8px 30px rgba(30,60,48,.06)}.stat b{font-size:28px}.stat span{display:block;color:var(--muted);font-size:13px;font-weight:750}.tools{display:grid;grid-template-columns:1fr auto;gap:10px;margin:16px 0}.filters{display:flex;gap:7px;overflow:auto;padding-bottom:3px}.filter{border:0;background:#fff;border-radius:999px;padding:9px 13px;font-weight:800;white-space:nowrap}.filter.on{background:#17221e;color:#fff}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:var(--card);border:1px solid rgba(255,255,255,.95);border-radius:24px;padding:20px;box-shadow:0 10px 35px rgba(30,60,48,.06);animation:up .35s ease both}@keyframes up{from{opacity:0;transform:translateY(8px)}}.cardtop{display:flex;justify-content:space-between;gap:12px}.name{font-size:19px;font-weight:900}.pet{color:var(--muted);margin-top:3px}.when{padding:8px 10px;background:#efedff;color:#6254c7;border-radius:12px;font-weight:850;font-size:13px;height:max-content}.meta{display:grid;gap:7px;margin:16px 0}.meta a{color:var(--mint2);font-weight:850;text-decoration:none}.comment{padding:11px 12px;background:#f4f7f5;border-radius:12px;color:#526059;margin:12px 0}.badge{display:inline-block;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:900}.new{background:#fff2d9;color:#95600a}.accepted{background:#e7f9f2;color:#087657}.completed{background:#edf0f2;color:#58636a}.rejected{background:#fff0ee;color:#a7443a}.cardactions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.cardactions .btn{padding:9px 11px;font-size:13px}.empty{grid-column:1/-1;padding:50px;text-align:center;background:#fff;border-radius:22px;color:var(--muted)}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#17221e;color:#fff;padding:12px 16px;border-radius:14px;transition:.2s;z-index:100}.toast.show{opacity:1;transform:translateX(-50%)}dialog{border:0;border-radius:24px;padding:0;width:min(520px,calc(100% - 24px));box-shadow:0 30px 100px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(20,30,26,.42);backdrop-filter:blur(4px)}.modal{padding:22px}.modal h2{margin:0 0 14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modalfooter{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.error{display:none;background:#fff0ee;color:#a7443a;padding:11px;border-radius:12px;margin:10px 0}
@media(max-width:760px){.shell{padding:12px}.stats{grid-template-columns:1fr 1fr}.list{grid-template-columns:1fr}.tools{grid-template-columns:1fr}.topbar{top:6px}.topbar .label{display:none}.hero{display:block}.hero h1{font-size:29px}.grid2{grid-template-columns:1fr}.cardactions .btn{flex:1}.stat{padding:14px}}
</style></head><body>
<div id="loginView" class="shell"><form id="loginForm" class="login"><div style="font-size:42px">🐾</div><h1>Северная звезда</h1><p>Приложение администратора клиники</p><div id="loginError" class="error"></div><input id="login" class="input" placeholder="Логин" autocomplete="username" required><input id="password" class="input" type="password" placeholder="Пароль" autocomplete="current-password" required><button id="loginBtn" class="btn primary" style="width:100%;margin-top:8px">Войти</button></form></div>
<div id="panel" class="panel"><div class="shell"><div class="topbar"><div class="brand">🐾 Северная звезда<small>Администратор</small></div><div class="actions"><button id="installBtn" class="btn ghost" hidden>📲 <span class="label">Установить</span></button><button id="refreshBtn" class="btn ghost">↻ <span class="label">Обновить</span></button><button id="logoutBtn" class="btn ghost">Выйти</button></div></div>
<div class="hero"><div><h1>Заявки</h1><p id="syncText">Загружаем данные…</p></div><button id="addBtn" class="btn primary">＋ Новая запись</button></div>
<div class="stats"><div class="stat"><b id="sAll">0</b><span>Всего</span></div><div class="stat"><b id="sNew">0</b><span>Новые</span></div><div class="stat"><b id="sToday">0</b><span>Сегодня</span></div><div class="stat"><b id="sAccepted">0</b><span>Приняты</span></div></div>
<div class="tools"><input id="search" class="input" placeholder="Поиск: имя, питомец, телефон…"><div class="filters"><button class="filter on" data-filter="all">Все</button><button class="filter" data-filter="new">Новые</button><button class="filter" data-filter="accepted">Приняты</button><button class="filter" data-filter="completed">Завершены</button><button class="filter" data-filter="rejected">Отклонены</button></div></div><div id="list" class="list"></div></div></div>
<dialog id="editDialog"><form id="editForm" class="modal"><h2 id="modalTitle">Изменить запись</h2><input id="editId" type="hidden"><div class="grid2"><input id="eOwner" class="input" placeholder="Имя" required><input id="ePhone" class="input" placeholder="Телефон" required></div><input id="ePet" class="input" placeholder="Питомец" required><div class="grid2"><input id="eDate" class="input" type="date" required><select id="eTime" class="input" required><option value="">Выберите время</option></select></div><textarea id="eComment" class="input" rows="3" placeholder="Комментарий"></textarea><div id="editError" class="error"></div><div class="modalfooter"><button type="button" id="cancelEdit" class="btn ghost">Отмена</button><button class="btn primary">Сохранить</button></div></form></dialog>
<div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let data=[],filter='all',installPrompt=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function today(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function statusText(s){return ({new:'Новая',accepted:'Принята',completed:'Завершена',rejected:'Отклонена'})[s]||'Новая'}
function normalize(b){return {...b,status:b.status||'new',booking_time:String(b.booking_time||'').slice(0,5)}}
async function api(url,opt){let r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(r.status===401){showLogin();throw Error('Сессия закончилась')}if(!r.ok)throw Error(d.error||'Ошибка сервера');return d}
function showLogin(){$('#panel').style.display='none';$('#loginView').style.display='block'}
function showPanel(){$('#loginView').style.display='none';$('#panel').style.display='block'}
async function load(silent=false){try{let d=await api('/.netlify/functions/get-bookings',{cache:'no-store'});data=(d.bookings||[]).map(normalize);showPanel();render();$('#syncText').textContent='Обновлено '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});if(!silent)toast('Заявки обновлены')}catch(e){if(!silent)toast(e.message)}}
function render(){let q=$('#search').value.trim().toLowerCase(),arr=data.filter(b=>(filter==='all'||b.status===filter)&&(!q||[b.owner_name,b.pet,b.phone,b.comment].join(' ').toLowerCase().includes(q)));
 $('#sAll').textContent=data.length;$('#sNew').textContent=data.filter(x=>x.status==='new').length;$('#sToday').textContent=data.filter(x=>x.booking_date===today()).length;$('#sAccepted').textContent=data.filter(x=>x.status==='accepted').length;
 $('#list').innerHTML=arr.length?arr.map(b=>`<article class="card"><div class="cardtop"><div><div class="name">${esc(b.owner_name||'Без имени')}</div><div class="pet">🐾 ${esc(b.pet||'Питомец')}</div></div><div class="when">${esc(b.booking_date)} · ${esc(b.booking_time)}</div></div><div style="margin-top:12px"><span class="badge ${esc(b.status)}">${statusText(b.status)}</span>${b.booking_type==='traumatologist'?' <span class="badge accepted">👨‍⚕️ Травматолог</span>':''}</div><div class="meta"><div>📞 <a href="tel:${esc(b.phone)}">${esc(b.phone||'—')}</a></div></div>${b.comment?`<div class="comment">💬 ${esc(b.comment)}</div>`:''}<div class="cardactions">${b.status==='new'?`<button class="btn primary" onclick="setStatus('${b.id}','accepted')">Принять</button><button class="btn danger" onclick="setStatus('${b.id}','rejected')">Отклонить</button>`:''}${b.status==='accepted'?`<button class="btn primary" onclick="setStatus('${b.id}','completed')">Завершить</button>`:''}<button class="btn ghost" onclick="openEdit('${b.id}')">✏️ Изменить</button><button class="btn ghost" onclick="removeBooking('${b.id}')">🗑</button></div></article>`).join(''):'<div class="empty">Подходящих заявок нет 🐾</div>'}
async function action(body){await api('/.netlify/functions/manage-booking',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});await load(true)}
window.setStatus=async(id,status)=>{try{await action({action:'status',id,status});toast('Статус изменён')}catch(e){toast(e.message)}}
window.removeBooking=async id=>{if(!confirm('Удалить эту запись?'))return;try{await action({action:'delete',id});toast('Запись удалена')}catch(e){toast(e.message)}}
async function loadTimes(date,selected=''){let s=$('#eTime');s.innerHTML='<option value="">Загружаем…</option>';try{let d=await api('/.netlify/functions/get-available-slots?date='+encodeURIComponent(date),{cache:'no-store'}),times=d.slots||[];if(selected&&!times.includes(selected))times.unshift(selected);s.innerHTML='<option value="">Выберите время</option>'+times.map(t=>`<option ${t===selected?'selected':''}>${esc(t)}</option>`).join('')}catch(e){s.innerHTML='<option value="">Ошибка расписания</option>'}}
window.openEdit=async id=>{let b=data.find(x=>String(x.id)===String(id));$('#modalTitle').textContent='Изменить запись';$('#editId').value=b.id;$('#eOwner').value=b.owner_name||'';$('#ePhone').value=b.phone||'';$('#ePet').value=b.pet||'';$('#eDate').value=b.booking_date||'';$('#eComment').value=b.comment||'';await loadTimes(b.booking_date,b.booking_time);$('#editDialog').showModal()}
$('#addBtn').onclick=()=>{$('#modalTitle').textContent='Новая запись';$('#editForm').reset();$('#editId').value='';$('#eTime').innerHTML='<option value="">Сначала выберите дату</option>';$('#editDialog').showModal()}
$('#eDate').onchange=()=>loadTimes($('#eDate').value);
$('#cancelEdit').onclick=()=>$('#editDialog').close();
$('#editForm').onsubmit=async e=>{e.preventDefault();$('#editError').style.display='none';let body={action:$('#editId').value?'edit':'create',id:$('#editId').value||undefined,owner_name:$('#eOwner').value.trim(),phone:$('#ePhone').value.trim(),pet:$('#ePet').value.trim(),booking_date:$('#eDate').value,booking_time:$('#eTime').value,comment:$('#eComment').value.trim()};try{await action(body);$('#editDialog').close();toast(body.id?'Запись изменена':'Запись создана')}catch(err){$('#editError').textContent=err.message;$('#editError').style.display='block'}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();let b=$('#loginBtn'),er=$('#loginError');er.style.display='none';b.disabled=true;b.textContent='Входим…';try{await api('/.netlify/functions/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:$('#login').value,password:$('#password').value})});$('#password').value='';await load(true)}catch(x){er.textContent=x.message;er.style.display='block'}finally{b.disabled=false;b.textContent='Войти'}}
$('#logoutBtn').onclick=async()=>{await fetch('/.netlify/functions/admin-logout',{method:'POST'});showLogin()}
$('#refreshBtn').onclick=()=>load();$('#search').oninput=render;$$('.filter').forEach(b=>b.onclick=()=>{$$('.filter').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.filter;render()});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('#installBtn').hidden=false});$('#installBtn').onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('#installBtn').hidden=true}};
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&$('#panel').style.display==='block')load(true)});setInterval(()=>{if(!document.hidden&&$('#panel').style.display==='block')load(true)},30000);
load(true);
</script></body></html>
