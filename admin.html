<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заявки — Северная звезда</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #f6faf8;
    color: #20262b;
    font-family: Arial, sans-serif;
  }

  .header {
    background: white;
    padding: 22px 20px;
    border-bottom: 1px solid #e7eee9;
  }

  .header-inner {
    max-width: 720px;
    margin: auto;
  }

  .logo {
    font-size: 22px;
    font-weight: 800;
    color: #1fbe8f;
  }

  .subtitle {
    margin-top: 4px;
    color: #68747d;
    font-size: 14px;
  }

  .wrap {
    max-width: 720px;
    margin: auto;
    padding: 24px 18px 50px;
  }

  /* ВХОД */

  .login-box {
    max-width: 420px;
    margin: 60px auto;
    background: white;
    padding: 28px;
    border-radius: 22px;
    box-shadow: 0 6px 25px rgba(0,0,0,.07);
  }

  .login-box h1 {
    margin: 0 0 8px;
    font-size: 27px;
  }

  .login-description {
    color: #68747d;
    margin-bottom: 22px;
  }

  .input {
    width: 100%;
    border: 1px solid #dfe7e2;
    border-radius: 13px;
    padding: 13px 14px;
    font-size: 16px;
    margin-bottom: 12px;
    outline: none;
  }

  .input:focus {
    border-color: #1fbe8f;
  }

  .login-btn,
  .refresh,
  .logout {
    border: 0;
    cursor: pointer;
    font-weight: 700;
  }

  .login-btn {
    width: 100%;
    background: #1fbe8f;
    color: white;
    padding: 13px;
    border-radius: 13px;
    font-size: 16px;
  }

  .login-btn:disabled {
    opacity: .6;
  }

  .login-error,
  .error {
    background: #fff0ed;
    color: #b8493a;
    border-radius: 14px;
    padding: 13px;
    margin-bottom: 15px;
    display: none;
  }

  /* АДМИНКА */

  .admin-panel {
    display: none;
  }

  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 18px;
  }

  h1 {
    margin: 0;
    font-size: 28px;
  }

  .count {
    background: #e7faf3;
    color: #0d8b67;
    padding: 8px 13px;
    border-radius: 999px;
    font-weight: 700;
    white-space: nowrap;
  }

  .actions {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .refresh {
    background: #1fbe8f;
    color: white;
    padding: 10px 15px;
    border-radius: 999px;
  }

  .logout {
    background: #eef2f0;
    color: #4f5960;
    padding: 10px 15px;
    border-radius: 999px;
  }

  .refresh:disabled {
    opacity: .6;
  }

  .empty {
    background: white;
    border-radius: 20px;
    padding: 40px 20px;
    text-align: center;
    color: #7a858d;
    box-shadow: 0 4px 18px rgba(0,0,0,.05);
  }

  .booking {
    background: white;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 14px;
    box-shadow: 0 4px 18px rgba(0,0,0,.06);
  }

  .booking-top {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: flex-start;
  }

  .name {
    font-size: 19px;
    font-weight: 800;
  }

  .pet {
    margin-top: 3px;
    color: #68747d;
  }

  .date {
    background: #f1efff;
    color: #6658d8;
    padding: 7px 10px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
  }

  .info {
    margin-top: 18px;
    display: grid;
    gap: 9px;
  }

  .info-row {
    display: flex;
    gap: 8px;
  }

  .label {
    color: #89939b;
    min-width: 90px;
  }

  .comment {
    margin-top: 15px;
    padding: 12px;
    background: #f8f9f8;
    border-radius: 12px;
    color: #4f5960;
  }

  @media (max-width: 520px) {

    .booking-top {
      flex-direction: column;
    }

    .date {
      align-self: flex-start;
    }

    .info-row {
      flex-direction: column;
      gap: 2px;
    }

    .actions {
      flex-wrap: wrap;
    }
  }
</style>
</head>

<body>

<header class="header">
  <div class="header-inner">

    <div class="logo">
      🐾 Северная звезда
    </div>

    <div class="subtitle">
      Панель администратора
    </div>

  </div>
</header>


<!-- ЭКРАН ВХОДА -->

<div id="loginScreen" class="wrap">

  <div class="login-box">

    <h1>
      Вход в админку
    </h1>

    <div class="login-description">
      Доступ к заявкам клиники
    </div>

    <div
      id="loginError"
      class="login-error">
    </div>

    <form id="loginForm">

      <input
        id="login"
        class="input"
        type="text"
        placeholder="Логин"
        autocomplete="username"
        required
      >

      <input
        id="password"
        class="input"
        type="password"
        placeholder="Пароль"
        autocomplete="current-password"
        required
      >

      <button
        id="loginBtn"
        class="login-btn"
        type="submit">
        Войти
      </button>

    </form>

  </div>

</div>


<!-- АДМИН-ПАНЕЛЬ -->

<main
  id="adminPanel"
  class="wrap admin-panel">

  <div class="top">

    <h1>
      Заявки
    </h1>

    <div
      class="count"
      id="count">
      0 заявок
    </div>

  </div>


  <div class="actions">

    <button
      class="refresh"
      id="refreshBtn">
      Обновить заявки
    </button>

    <button
      class="logout"
      id="logoutBtn">
      Выйти
    </button>

  </div>


  <div
    class="error"
    id="error">
  </div>


  <div
    id="bookings"
    style="margin-top:20px;">

    <div class="empty">
      Загружаем заявки...
    </div>

  </div>

</main>


<script>

async function loginAdmin(login, password) {

  const response = await fetch(
    '/.netlify/functions/admin-login',
    {
      method: 'POST',

      headers: {
        'Content-Type': 'application/json'
      },

      body: JSON.stringify({
        login: login,
        password: password
      })
    }
  );

  const data = await response.json();

  if (!response.ok) {
    throw new Error(
      data.error || 'Не удалось выполнить вход'
    );
  }

  return data;
}


async function loadBookings() {

  const container =
    document.getElementById('bookings');

  const count =
    document.getElementById('count');

  const error =
    document.getElementById('error');

  const refreshBtn =
    document.getElementById('refreshBtn');


  error.style.display = 'none';

  refreshBtn.disabled = true;

  refreshBtn.textContent = 'Загружаем...';


  try {

    const response = await fetch(
      '/.netlify/functions/get-bookings'
    );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        'Не удалось загрузить заявки'
      );

    }


    const bookings =
      data.bookings || [];


    count.textContent =
      bookings.length +
      (
        bookings.length === 1
          ? ' заявка'
          : bookings.length < 5
            ? ' заявки'
            : ' заявок'
      );


    if (!bookings.length) {

      container.innerHTML = `
        <div class="empty">
          Пока заявок нет 🐾
        </div>
      `;

      return;
    }


    container.innerHTML =
      bookings.map(function (booking) {

        return `

          <div class="booking">

            <div class="booking-top">

              <div>

                <div class="name">
                  ${escapeHtml(
                    booking.owner_name ||
                    'Без имени'
                  )}
                </div>

                <div class="pet">
                  🐾 ${escapeHtml(
                    booking.pet ||
                    'Животное не указано'
                  )}
                </div>

              </div>


              <div class="date">

                ${escapeHtml(
                  booking.booking_date ||
                  ''
                )}

                ${escapeHtml(
                  booking.booking_time ||
                  ''
                )}

              </div>

            </div>


            <div class="info">

              <div class="info-row">

                <span class="label">
                  Телефон:
                </span>

                <strong>
                  ${escapeHtml(
                    booking.phone || '—'
                  )}
                </strong>

              </div>


              <div class="info-row">

                <span class="label">
                  Дата:
                </span>

                <span>
                  ${escapeHtml(
                    booking.booking_date ||
                    '—'
                  )}
                </span>

              </div>


              <div class="info-row">

                <span class="label">
                  Время:
                </span>

                <span>
                  ${escapeHtml(
                    booking.booking_time ||
                    '—'
                  )}
                </span>

              </div>

            </div>


            ${
              booking.comment
                ? `
                  <div class="comment">
                    💬 ${escapeHtml(
                      booking.comment
                    )}
                  </div>
                `
                : ''
            }

          </div>

        `;

      }).join('');


  } catch (err) {

    console.error(err);


    error.textContent =
      err.message ||
      'Ошибка загрузки заявок';


    error.style.display = 'block';


    container.innerHTML = `

      <div class="empty">
        Не удалось загрузить заявки.
      </div>

    `;

  } finally {

    refreshBtn.disabled = false;

    refreshBtn.textContent =
      'Обновить заявки';

  }

}


function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


/* ВХОД */

document
  .getElementById('loginForm')
  .addEventListener(
    'submit',
    async function (event) {

      event.preventDefault();


      const login =
        document.getElementById('login').value;

      const password =
        document.getElementById('password').value;


      const loginBtn =
        document.getElementById('loginBtn');

      const loginError =
        document.getElementById('loginError');


      loginError.style.display = 'none';

      loginBtn.disabled = true;

      loginBtn.textContent =
        'Входим...';


      try {

        await loginAdmin(
          login,
          password
        );


        document.getElementById(
          'loginScreen'
        ).style.display = 'none';


        document.getElementById(
          'adminPanel'
        ).style.display = 'block';


        document.getElementById(
          'login'
        ).value = '';


        document.getElementById(
          'password'
        ).value = '';


        loadBookings();


      } catch (error) {

        loginError.textContent =
          error.message ||
          'Ошибка входа';


        loginError.style.display =
          'block';

      } finally {

        loginBtn.disabled = false;

        loginBtn.textContent =
          'Войти';

      }

    }
  );


/* ОБНОВЛЕНИЕ */

document
  .getElementById('refreshBtn')
  .addEventListener(
    'click',
    loadBookings
  );


/* ВЫХОД */

document
  .getElementById('logoutBtn')
  .addEventListener(
    'click',
    function () {

      location.reload();

    }
  );

</script>

</body>
</html>
